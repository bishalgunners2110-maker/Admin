<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>EchoImpact Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/><style>*,:before,:after{box-sizing:border-box;margin:0;padding:0}:root{--primary:#f59e0b;--primary-dark:#d97706;--bg:#0a0a0a;--bg-card:#111;--bg-hover:#1a1a1a;--text:#f1f1f1;--text-muted:#888;--border:#2a2a2a;--success:#22c55e;--error:#ef4444}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:var(--bg-card);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;z-index:100}.main{margin-left:260px;min-height:100vh;padding:2rem 2.5rem}.brand{padding:1.5rem;border-bottom:1px solid var(--border);margin-bottom:.5rem}.brand h2{font-size:1.25rem;font-weight:700;color:var(--primary)}.brand span{font-size:.75rem;color:var(--text-muted)}.nav{padding:0 .5rem}.nav-label{padding:.5rem 1rem;font-size:.675rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}.nav-item{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;margin:0 .25rem .1rem;border-radius:6px;cursor:pointer;color:var(--text-muted);font-size:.875rem;font-weight:500;border:none;width:100%;background:none;text-align:left;transition:all .15s}.nav-item:hover{color:var(--text);background:var(--bg-hover)}.nav-item.active{color:var(--primary);background:rgba(245,158,11,.1)}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1.5rem}.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}.card-title{font-size:1.125rem;font-weight:600}.btn{display:inline-flex;align-items:center;gap:.4rem;border:none;border-radius:6px;padding:.5rem 1rem;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .1s;white-space:nowrap}.btn-sm{padding:.375rem .75rem;font-size:.8125rem}.btn-primary{background:var(--primary);color:#000}.btn-primary:hover{background:var(--primary-dark)}.btn-secondary{background:var(--bg-hover);color:var(--text);border:1px solid var(--border)}.btn-danger{background:rgba(239,68,68,.12);color:var(--error);border:1px solid rgba(239,68,68,.25)}.btn-danger:hover{background:rgba(239,68,68,.2)}table{width:100%;border-collapse:collapse}th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid var(--border)}th{font-size:.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}tbody tr:hover{background:var(--bg-hover)}.badge{display:inline-flex;align-items:center;padding:.25rem .6rem;border-radius:4px;font-size:.75rem;font-weight:500}.badge-green{background:rgba(34,197,94,.15);color:#22c55e}.badge-yellow{background:rgba(245,158,11,.15);color:var(--primary)}.badge-red{background:rgba(239,68,68,.15);color:var(--error)}.form-group{margin-bottom:1rem}.form-label{display:block;margin-bottom:.375rem;font-size:.875rem;font-weight:500}.form-control{width:100%;padding:.5rem .75rem;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.875rem;font-family:inherit;transition:border .15s}.form-control:focus{outline:none;border-color:var(--primary)}.form-control::placeholder{color:var(--text-muted)}textarea.form-control{resize:vertical;min-height:100px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1.25rem}.stat-value{font-size:2.25rem;font-weight:700;color:var(--primary);line-height:1}.stat-label{font-size:.8125rem;color:var(--text-muted);margin-top:.25rem}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s}.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:2rem;width:560px;max-width:90vw;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}.modal-title{font-size:1.125rem;font-weight:600}.alert{padding:1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem}.alert-error{background:rgba(239,68,68,.1);color:var(--error);border:1px solid rgba(239,68,68,.25)}.alert-success{background:rgba(34,197,94,.1);color:var(--success);border:1px solid rgba(34,197,94,.25)}.loading{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:1rem 1.5rem;font-size:.875rem;z-index:9999}.toast.success{border-left:3px solid var(--success)}.toast.error{border-left:3px solid var(--error)}.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}.page-title{font-size:1.5rem;font-weight:700}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style></head><body><script>
const API='https://pgndibdippqikmwpeueg.supabase.co/functions/v1/api';
let token=localStorage.getItem('ei_token');
async function req(path,method='GET',body=null){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});return r.json()}
function toast(msg,type='success'){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function navigate(page){document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=document.getElementById('page-content');c.innerHTML='<div style="text-align:center;padding:3rem"><div class="loading"></div></div>';setTimeout(()=>{switch(page){case 'dashboard':loadDashboard();break;case 'homepage':loadHomepage();break;case 'celebrities':loadCelebrities();break;case 'podcasts':loadPodcasts();break;case 'enquiries':loadEnquiries();break;case 'settings':loadSettings();break}},50)}
function bindNav(){document.querySelectorAll('.nav-item[data-page]').forEach(b=>{b.onclick=()=>navigate(b.dataset.page)});document.getElementById('logout-btn').onclick=()=>{localStorage.removeItem('ei_token');token=null;showLogin()}}
async function loadDashboard(){const c=document.getElementById('page-content');try{const[a,b,d,s]=await Promise.all([req('/celebrities'),req('/podcasts'),req('/enquiries'),req('/settings')]);c.innerHTML=`<div class="page-header"><h1 class="page-title">Dashboard</h1></div><div class="stats-grid"><div class="stat-card"><div class="stat-value">${Array.isArray(a)?a.length:0}</div><div class="stat-label">Celebrities</div></div><div class="stat-card"><div class="stat-value">${Array.isArray(b)?b.length:0}</div><div class="stat-label">Podcasts</div></div><div class="stat-card"><div class="stat-value">${Array.isArray(d)?d.length:0}</div><div class="stat-label">Enquiries</div></div><div class="stat-card"><div class="stat-value" style="font-size:1.2rem">${s?.site_name||'EchoImpact'}</div><div class="stat-label">Site Name</div></div></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load dashboard</div>'}}
async function loadHomepage(){const c=document.getElementById('page-content');try{const d=await req('/homepage');c.innerHTML=`<div class="page-header"><h1 class="page-title">Homepage</h1></div><div class="card"><div class="card-header"><h3 class="card-title">Hero Section</h3></div><div class="form-group"><label class="form-label">Hero Title</label><input type="text" class="form-control" id="hero_title" value="${d.hero_title||''}"/></div><div class="form-group"><label class="form-label">Hero Subtitle</label><input type="text" class="form-control" id="hero_subtitle" value="${d.hero_subtitle||''}"/></div><div class="form-group"><label class="form-label">Showreel URL</label><input type="url" class="form-control" id="showreel_url" value="${d.showreel_url||''}"/></div><button class="btn btn-primary" onclick="saveHomepage()">Save Changes</button></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load</div>'}}
async function saveHomepage(){try{await req('/homepage','POST',{hero_title:document.getElementById('hero_title').value,hero_subtitle:document.getElementById('hero_subtitle').value,showreel_url:document.getElementById('showreel_url').value});toast('Homepage saved!')}catch(e){toast('Failed to save','error')}}
async function loadCelebrities(){const c=document.getElementById('page-content');try{const data=await req('/celebrities');const rows=Array.isArray(data)?data.map(x=>`<tr><td>${x.name}</td><td>${x.category||'-'}</td><td><span class="badge ${x.is_active?'badge-green':'badge-red'}">${x.is_active?'Active':'Inactive'}</span></td><td><button class="btn btn-sm btn-secondary" onclick="editCel(${x.id})">Edit</button> <button class="btn btn-sm btn-danger" onclick="delCel(${x.id})">Delete</button></td></tr>`).join(''):'';c.innerHTML=`<div class="page-header"><h1 class="page-title">Celebrities</h1><button class="btn btn-primary" onclick="addCelModal()">+ Add</button></div><div class="card"><table><thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">No celebrities found</td></tr>'}</tbody></table></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load</div>'}}
function addCelModal(){showModal('Add Celebrity',`<div class="form-group"><label class="form-label">Name</label><input id="cn" type="text" class="form-control" placeholder="Celebrity name"/></div><div class="form-group"><label class="form-label">Category</label><select id="cc" class="form-control"><option>Bollywood</option><option>Hollywood</option><option>Music</option><option>Sports</option><option>Business</option><option>Other</option></select></div><div class="form-group"><label class="form-label">Bio</label><textarea id="cb" class="form-control" placeholder="Biography..."></textarea></div><div class="form-group"><label class="form-label">Image URL</label><input id="ci" type="url" class="form-control" placeholder="https://..."/></div>`,async()=>{await req('/celebrities','POST',{name:document.getElementById('cn').value,category:document.getElementById('cc').value,bio:document.getElementById('cb').value,image_url:document.getElementById('ci').value});toast('Celebrity added!');closeModal();loadCelebrities()})}
async function editCel(id){const d=await req('/celebrities/'+id);showModal('Edit Celebrity',`<div class="form-group"><label class="form-label">Name</label><input id="cn" type="text" class="form-control" value="${d.name||''}"/></div><div class="form-group"><label class="form-label">Category</label><select id="cc" class="form-control"><option>Bollywood</option><option>Hollywood</option><option>Music</option><option>Sports</option><option>Business</option><option>Other</option></select></div><div class="form-group"><label class="form-label">Bio</label><textarea id="cb" class="form-control">${d.bio||''}</textarea></div><div class="form-group"><label class="form-label">Image URL</label><input id="ci" type="url" class="form-control" value="${d.image_url||''}"/></div>`,async()=>{await req('/celebrities/'+id,'PUT',{name:document.getElementById('cn').value,category:document.getElementById('cc').value,bio:document.getElementById('cb').value,image_url:document.getElementById('ci').value});toast('Updated!');closeModal();loadCelebrities()})}
async function delCel(id){if(!confirm('Delete this celebrity?'))return;await req('/celebrities/'+id,'DELETE');toast('Deleted!');loadCelebrities()}
async function loadPodcasts(){const c=document.getElementById('page-content');try{const data=await req('/podcasts');const rows=Array.isArray(data)?data.map(p=>`<tr><td>${p.title}</td><td>${p.host_name||'-'}</td><td><span class="badge ${p.is_published?'badge-green':'badge-yellow'}">${p.is_published?'Published':'Draft'}</span></td><td><button class="btn btn-sm btn-secondary" onclick="editPod(${p.id})">Edit</button> <button class="btn btn-sm btn-danger" onclick="delPod(${p.id})">Delete</button></td></tr>`).join(''):'';c.innerHTML=`<div class="page-header"><h1 class="page-title">Podcasts</h1><button class="btn btn-primary" onclick="addPodModal()">+ Add</button></div><div class="card"><table><thead><tr><th>Title</th><th>Host</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">No podcasts found</td></tr>'}</tbody></table></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load</div>'}}
function addPodModal(){showModal('Add Podcast',`<div class="form-group"><label class="form-label">Title</label><input id="pt" type="text" class="form-control" placeholder="Podcast title"/></div><div class="form-group"><label class="form-label">Host Name</label><input id="ph" type="text" class="form-control" placeholder="Host name"/></div><div class="form-group"><label class="form-label">Description</label><textarea id="pd" class="form-control"></textarea></div>`,async()=>{await req('/podcasts','POST',{title:document.getElementById('pt').value,host_name:document.getElementById('ph').value,description:document.getElementById('pd').value});toast('Podcast added!');closeModal();loadPodcasts()})}
async function editPod(id){const d=await req('/podcasts/'+id);showModal('Edit Podcast',`<div class="form-group"><label class="form-label">Title</label><input id="pt" type="text" class="form-control" value="${d.title||''}"/></div><div class="form-group"><label class="form-label">Host Name</label><input id="ph" type="text" class="form-control" value="${d.host_name||''}"/></div><div class="form-group"><label class="form-label">Description</label><textarea id="pd" class="form-control">${d.description||''}</textarea></div>`,async()=>{await req('/podcasts/'+id,'PUT',{title:document.getElementById('pt').value,host_name:document.getElementById('ph').value,description:document.getElementById('pd').value});toast('Updated!');closeModal();loadPodcasts()})}
async function delPod(id){if(!confirm('Delete this podcast?'))return;await req('/podcasts/'+id,'DELETE');toast('Deleted!');loadPodcasts()}
async function loadEnquiries(){const c=document.getElementById('page-content');try{const data=await req('/enquiries');const rows=Array.isArray(data)?data.map(e=>`<tr><td>${e.name}</td><td>${e.email}</td><td>${e.phone||'-'}</td><td>${new Date(e.created_at).toLocaleDateString()}</td></tr>`).join(''):'';c.innerHTML=`<div class="page-header"><h1 class="page-title">Enquiries</h1></div><div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Date</th></tr></thead><tbody>${rows||'<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">No enquiries yet</td></tr>'}</tbody></table></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load</div>'}}
async function loadSettings(){const c=document.getElementById('page-content');try{const d=await req('/settings');c.innerHTML=`<div class="page-header"><h1 class="page-title">Settings</h1></div><div class="card"><div class="form-group"><label class="form-label">Site Name</label><input type="text" class="form-control" id="ss" value="${d.site_name||'EchoImpact'}"/></div><div class="form-group"><label class="form-label">Contact Email</label><input type="email" class="form-control" id="se" value="${d.contact_email||''}"/></div><button class="btn btn-primary" onclick="saveSettings()">Save Settings</button></div>`}catch(e){c.innerHTML='<div class="alert alert-error">Failed to load</div>'}}
async function saveSettings(){try{await req('/settings','POST',{site_name:document.getElementById('ss').value,contact_email:document.getElementById('se').value});toast('Settings saved!')}catch(e){toast('Failed to save','error')}}
function showModal(title,bodyHtml,onSave){const m=document.createElement('div');m.className='modal-overlay';m.innerHTML=`<div class="modal"><div class="modal-header"><h3 class="modal-title">${title}</h3><button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button></div>${bodyHtml}<div style="margin-top:1.5rem;display:flex;gap:.75rem;justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="msb">Save</button></div></div>`;document.body.appendChild(m);if(onSave)document.getElementById('msb').onclick=onSave}
function closeModal(){const m=document.querySelector('.modal-overlay');if(m)m.remove()}
function showLogin(){document.body.innerHTML=`<style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}.lb{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:2.5rem;width:400px;max-width:95vw}.lh{text-align:center;margin-bottom:2rem}.lh h2{font-size:1.5rem;font-weight:700;color:var(--primary)}.lh p{color:var(--text-muted);font-size:.875rem;margin-top:.25rem}</style><div class="lb"><div class="lh"><h2>&#9889; EchoImpact</h2><p>Admin Panel</p></div><div class="form-group"><label class="form-label">Email</label><input id="le" type="email" class="form-control" placeholder="admin@echoimpact.com"/></div><div class="form-group"><label class="form-label">Password</label><input id="lp" type="password" class="form-control" placeholder="Password"/></div><div id="lerr" class="alert alert-error" style="display:none"></div><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Sign In</button></div>`;document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){const el=document.getElementById('lerr');el.style.display='none';try{const d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('le').value,password:document.getElementById('lp').value})}).then(r=>r.json());if(d.token){token=d.token;localStorage.setItem('ei_token',token);initApp()}else{el.textContent=d.error||'Invalid credentials';el.style.display=''}}catch(e){el.textContent='Network error. Please try again.';el.style.display=''}}
function initApp(){document.body.innerHTML=`<nav class="sidebar"><div class="brand"><h2>&#9889; EchoImpact</h2><span>Admin Panel</span></div><nav class="nav"><div class="nav-label">Main</div><button class="nav-item" data-page="dashboard">Dashboard</button><button class="nav-item" data-page="homepage">Homepage</button><button class="nav-item" data-page="celebrities">Celebrities</button><button class="nav-item" data-page="podcasts">Podcasts</button><button class="nav-item" data-page="enquiries">Enquiries</button><div class="nav-label" style="margin-top:1rem">System</div><button class="nav-item" data-page="settings">Settings</button></nav><div style="margin-top:auto;border-top:1px solid var(--border);padding:1rem"><button class="nav-item" id="logout-btn" style="color:var(--error)">Logout</button></div></nav><main class="main" id="main-content"><div id="page-content"></div></main>`;bindNav();navigate('dashboard')}
if(token){initApp()}else{showLogin()}
</script></body></html>
